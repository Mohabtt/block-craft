    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-main: #07090E;
            --bg-card: #0F141C;
            --emerald: #00FF87;
            --emerald-glow: rgba(0, 255, 135, 0.25);
            --emerald-dark: #00B359;
            --text-main: #FFFFFF;
            --text-muted: #94A3B8;
            --border: rgba(255, 255, 255, 0.08);
            --radius-lg: 24px;
            --radius-md: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
            padding-bottom: 60px;
        }

        /* Background Effects */
        .ambient-glow {
            position: fixed;
            top: -20%;
            left: 50%;
            transform: translateX(-50%);
            width: 100vw;
            max-width: 800px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 255, 135, 0.12) 0%, rgba(7, 9, 14, 0) 70%);
            z-index: -1;
            pointer-events: none;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header */
        header {
            padding: 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: 1px solid var(--border);
            background: rgba(7, 9, 14, 0.6);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--emerald), var(--emerald-dark));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-size: 1.4rem;
            box-shadow: 0 0 20px var(--emerald-glow);
        }

        .brand-name {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        .brand-name span { color: var(--emerald); }

        /* Main Funnel Focus */
        .hero-funnel {
            text-align: center;
            padding: 40px 0 30px;
        }

        /* Live Activity Banner */
        .live-activity {
            background: rgba(0, 255, 135, 0.05);
            border: 1px solid rgba(0, 255, 135, 0.2);
            padding: 10px 18px;
            border-radius: 50px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            color: var(--emerald);
            font-weight: 600;
            margin-bottom: 24px;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background-color: var(--emerald);
            border-radius: 50%;
            animation: blink 1s infinite;
        }

        @keyframes blink { 50% { opacity: 0.3; } }

        .hero-funnel h1 {
            font-size: 2.3rem;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 24px;
            letter-spacing: -1px;
        }
        
        .hero-funnel h1 span {
            background: linear-gradient(135deg, #FFF, var(--emerald));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Stunning Premium Image Showcase */
        .hero-image-wrap {
            position: relative;
            max-width: 500px;
            margin: 0 auto 35px;
            padding: 8px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        .hero-image-wrap img {
            width: 100%;
            height: auto;
            border-radius: calc(var(--radius-lg) - 8px);
            display: block;
            aspect-ratio: 16/9;
            object-fit: cover;
        }

        .hero-overlay {
            position: absolute;
            top: 8px; left: 8px; right: 8px; bottom: 8px;
            border-radius: calc(var(--radius-lg) - 8px);
            background: linear-gradient(to top, rgba(7, 9, 14, 0.95) 0%, transparent 40%);
            pointer-events: none;
            display: flex;
            align-items: flex-end;
            padding: 20px;
        }

        .hero-overlay-text {
            text-align: left;
        }
        
        .hero-overlay-text h3 {
            font-size: 1.2rem;
            font-weight: 800;
            margin-bottom: 4px;
        }
        
        .hero-overlay-text p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin: 0;
        }

        /* Floating Badges */
        .floating-badge {
            position: absolute;
            background: rgba(15, 20, 28, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border);
            padding: 8px 14px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            animation: float 3s ease-in-out infinite;
        }

        .floating-badge i { color: var(--emerald); font-size: 0.9rem; }
        .badge-1 { top: -12px; left: -10px; animation-delay: 0s; }
        .badge-2 { top: -12px; right: -10px; animation-delay: 1.5s; }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* The Single Massive Button */
        .main-cta-wrapper {
            position: relative;
            max-width: 450px;
            margin: 0 auto 40px;
        }

        .btn-massive {
            background: linear-gradient(135deg, var(--emerald), var(--emerald-dark));
            color: #000;
            border: none;
            width: 100%;
            padding: 20px 20px;
            border-radius: var(--radius-md);
            font-size: 1.15rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 10px 30px var(--emerald-glow);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            animation: pulse-button 2.5s infinite;
        }

        .btn-massive:active { transform: scale(0.96); }
        .btn-massive i { font-size: 1.3rem; }

        @keyframes pulse-button {
            0% { box-shadow: 0 0 0 0 rgba(0, 255, 135, 0.4); }
            70% { box-shadow: 0 0 0 20px rgba(0, 255, 135, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 255, 135, 0); }
        }

        /* Trust Steps Section */
        .trust-section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 30px 24px;
            margin-bottom: 40px;
        }

        .trust-header {
            text-align: center;
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .trust-header i { color: #38BDF8; }

        .steps-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .step-row {
            display: flex;
            align-items: flex-start;
            gap: 16px;
        }

        .step-number {
            width: 32px;
            height: 32px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: var(--emerald);
            flex-shrink: 0;
        }

        .step-text h4 {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 4px;
            color: var(--text-main);
        }

        .step-text p {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        /* Modal / Bottom Sheet */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(4, 6, 10, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active { opacity: 1; visibility: visible; }

        .modal-sheet {
            background: var(--bg-card);
            border-top: 1px solid rgba(0, 255, 135, 0.3);
            border-radius: 24px 24px 0 0;
            width: 100%;
            max-width: 500px;
            padding: 24px 24px 40px;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            text-align: center;
            position: relative;
        }

        .modal-overlay.active .modal-sheet { transform: translateY(0); }

        .modal-drag {
            width: 40px; height: 4px;
            background: var(--border);
            border-radius: 10px;
            margin: 0 auto 20px;
        }

        .secure-icon {
            width: 60px; height: 60px;
            background: rgba(0, 255, 135, 0.1);
            border: 1px solid var(--emerald);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: var(--emerald);
            margin: 0 auto 16px;
        }

        .modal-sheet h3 { font-size: 1.3rem; font-weight: 800; margin-bottom: 8px; }
        .modal-sheet p { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 24px; line-height: 1.5; }

        /* The Actual CPA Link Button */
        .btn-cpa {
            background: linear-gradient(135deg, var(--emerald), var(--emerald-dark));
            color: #000;
            text-decoration: none;
            width: 100%;
            padding: 18px;
            border-radius: var(--radius-md);
            font-size: 1.05rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .close-btn {
            position: absolute; top: 20px; right: 20px;
            background: none; border: none; color: var(--text-muted);
            font-size: 1.2rem; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

        <section class="trust-section">

            </div>
            
            <div class="steps-container">
                <div class="step-row">
                    <div class="step-number">1</div>
                    <div class="step-text">

                        <p>Click the unlock button to securely connect to our world server.</p>
                    </div>
                </div>
                <div class="step-row">
                    <div class="step-number">2</div>
                    <div class="step-text">
                        <h4>Quick Verification (Bot Protection)</h4>
                        <p>Complete a quick 30-second app install or profile task to prove you are human. This keeps our servers fast and free.</p>
                    </div>
                </div>

                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- Secure CPA Gateway Modal -->
    <div class="modal-overlay" id="downloadModal">
        <div class="modal-sheet">
            <div class="modal-drag"></div>
            <button class="close-btn" onclick="closeModal()"><i class="fas fa-times"></i></button>
            
            <div class="secure-icon">
                <i class="fas fa-user-shield"></i>
            </div>
            
            <h3>Bot Protection Active</h3>
            <p>To access the Block Craft Premium Vault, please complete 1 quick free verification step to confirm you are a real player.</p>

            <!-- PASTE YOUR CPA LINK IN THE HREF BELOW -->
            <a href="YOUR_CPA_LINK_HERE" class="btn-cpa" target="_blank">
                <i class="fas fa-check-circle"></i> Verify & Download Now
            </a>
            
            <p style="font-size: 0.75rem; margin-top: 15px; margin-bottom: 0;">
                <i class="fas fa-lock"></i> AES-256 Encrypted Connection
            </p>
        </div>
    </div>

    <script>
        // Modal Logic
        const modal = document.getElementById('downloadModal');
        
        function openModal() {
            modal.classList.add('active');
            document.body.style.overflow = 'hidden'; // Stop background scrolling
        }

        function closeModal() {
            modal.classList.remove('active');
            document.body.style.overflow = 'auto'; // Re-enable scrolling
        }

        modal.addEventListener('click', function(e) {
            if (e.target === modal) closeModal();
        });

        // Fake Live User Counter
        setInterval(() => {
            const users = Math.floor(Math.random() * (89 - 42 + 1) + 42);
            document.querySelector('#liveUsers span').innerText = `${users} users currently downloading`;
        }, 4500);
    </script>
