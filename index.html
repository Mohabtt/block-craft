      // Live Countdown Timer
      function startTimer(duration, display) {
          let timer = duration, minutes, seconds;
          setInterval(function () {
              minutes = parseInt(timer / 60, 10);
              seconds = parseInt(timer % 60, 10);

              minutes = minutes < 10 ? "0" + minutes : minutes;
              seconds = seconds < 10 ? "0" + seconds : seconds;

              display.textContent = minutes + ":" + seconds;

              if (--timer < 0) {
                  timer = duration;
              }
          }, 1000);
      }

      window.onload = function () {
          const fiveMinutes = 60 * 4 + 59;
          const display = document.querySelector('#timer');
          if(display) startTimer(fiveMinutes, display);
      };

      // Ticker and Floating Notification System
      const users = ['Alex_Craft', 'Steve_99', 'BlockMaster', 'PixelKing', 'EnderKnight', 'RedstoneGuy', 'VoxelQueen', 'Marcus_MC', 'GamerGuy21', 'CraftyGirl'];
      const builds = ['Survival Base v4.2', 'Mega Castle Pack', 'Redstone Storage Unit', 'Nether Hub Schematics'];

      setInterval(() => {
          const userElem = document.getElementById('liveUser');
          const buildElem = document.getElementById('liveBuild');
          
          if(userElem && buildElem) {
              const randomUser = users[Math.floor(Math.random() * users.length)];
              const randomBuild = builds[Math.floor(Math.random() * builds.length)];
              const randomSec = Math.floor(Math.random() * 20) + 2;
              
              userElem.textContent = randomUser;
              buildElem.textContent = `${randomBuild} (${randomSec}s ago)`;
          }
      }, 3500);

      // Floating Toast Popups
      function showToast() {
          const toast = document.getElementById('liveToast');
          const toastUser = document.getElementById('toastUser');
          if(!toast || !toastUser) return;

          const randomUser = users[Math.floor(Math.random() * users.length)];
          toastUser.textContent = randomUser;

          toast.classList.add('show');
          setTimeout(() => {
              toast.classList.remove('show');
          }, 4000);
      }

      setInterval(showToast, 9000);
  //]]>
  </script>
